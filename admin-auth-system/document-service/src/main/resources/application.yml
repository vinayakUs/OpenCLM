spring:
  application:
    name: document-service




  datasource:
    url: jdbc:postgresql://localhost:5432/document_service?options=-c%20timezone=Asia/Kolkata
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always


server:
  port: 8086