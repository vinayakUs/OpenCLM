<nav class="navbar">
  <div class="navbar-left">
    <div class="brand-logo">
      <span class="material-icons">dns</span>
    </div>
    <div class="nav-links">
      <a routerLink="/home" routerLinkActive="active" class="nav-item">Dashboard</a>
      <a routerLink="/repository" routerLinkActive="active" class="nav-item">Repository</a>
      <a routerLink="/workflow-designer" routerLinkActive="active" class="nav-item">Workflow Designer</a>
      <a routerLink="/insights" routerLinkActive="active" class="nav-item">Insights</a>
    </div>
  </div>

  <div class="navbar-right">
    <button class="icon-btn" title="Help">
      <span class="material-icons">help_outline</span>
    </button>
    <button class="icon-btn" title="Notifications" (click)="toggleNotifications()" style="position: relative;">
      <span class="material-icons">notifications_none</span>
      <span class="notification-dot" *ngIf="unreadCount() > 0"></span>

      <!-- Notification Dropdown -->
      <div class="notification-dropdown" *ngIf="isNotificationOpen" (click)="$event.stopPropagation()">
        <div class="notif-header">
          <h3>Notifications</h3>
          <button class="text-btn-small" (click)="markAllRead()">
            <span class="material-icons" style="font-size: 16px;">done_all</span>
            Mark all as read
          </button>
        </div>

        <div class="notif-list">
          @for (n of notifications(); track n.id) {
          <div class="notif-item" [class.unread]="!n.read" (click)="markAsRead(n.id)">
            <!-- Unread Status Dot -->
            <div class="status-indicator"></div>

            <div class="notif-content">
              <div class="notif-top">
                <span class="notif-title">{{ n.title }}</span>
                <span class="notif-time">{{ n.createdAt | date:'shortTime' }}</span>
              </div>
              <p class="notif-msg">{{ n.message }}</p>
            </div>

            <!-- Circular Progress (Spinner) for 'progress' type -->
            <div class="spinner-container" *ngIf="n.type === 'progress'">
              <div class="circular-spinner"></div>
            </div>
          </div>
          }

          <div *ngIf="notifications().length === 0" class="empty-state">
            <span>You're all caught up!</span>
          </div>
        </div>
      </div>
    </button>

    <div class="divider"></div>

    <!-- Tenant Info (Placeholder or Real if available) -->
    <div class="user-info-item dropdown-trigger">
      <span class="text-label">OpenCLM</span>
      <span class="material-icons arrow">arrow_drop_down</span>
    </div>

    <div class="divider"></div>

    <!-- User Info -->
    <div class="user-info-item dropdown-trigger relative" (click)="toggleDropdown()">
      <ng-container *ngIf="user$ | async as user; else loading">
        <span class="text-label">{{ user.name }}</span>
      </ng-container>
      <ng-template #loading>
        <span class="text-label">Loading...</span>
      </ng-template>
      <span class="material-icons arrow">arrow_drop_down</span>

      <!-- Dropdown -->
      <div *ngIf="isDropdownOpen"
        class="absolute top-full right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50 ring-1 ring-black ring-opacity-5">
        <button (click)="logout()" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
          Sign out
        </button>
      </div>
    </div>
  </div>
</nav>
