server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      httpclient:
        max-header-size: 30MB
      routes:
        - id: auth-server
          uri: lb://auth-server
          predicates:
            - Path=/auth/**, /oauth2/**, /login/**
        
        - id: bff-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/**

        - id: storage-service
          uri: lb://storage-service
          predicates:
            - Path=/storage/**

        - id: workflow-service
          uri: lb://workflow-service
          predicates:
            - Path=/workflow/**

        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/document/**

        - id: contract-service
          uri: lb://contract-service
          predicates:
            - Path=/contract/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB




logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.server: DEBUG
    reactor.netty.http.client: DEBUG


eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
